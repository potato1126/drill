<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>情報生命科学 4択ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#1f2a24; --sub:#5d6b63; --line:#dfe5e0;
  --main:#2f7d5b; --main-d:#22603f; --main-l:#e3f2ea;
  --ok:#1e8a4c; --ok-bg:#e6f6ec; --ng:#c8372d; --ng-bg:#fdeceb;
  --warn:#b7791f; --warn-bg:#fff5e0;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
  font-weight:500;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{font-weight:800;font-size:1.05rem;color:var(--main-d);display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:4px 0;font-family:inherit}
.brand .dot{width:28px;height:28px;border-radius:9px;background:var(--main);display:grid;place-items:center;color:#fff;font-size:.9rem}
.save{font-size:.75rem;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
h1{font-size:1.45rem;margin:0 0 4px;font-weight:800}
h2{font-size:1.1rem;margin:0 0 12px;font-weight:800}
p{margin:0 0 10px}
.muted{color:var(--sub);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.2}
.stat span{font-size:.78rem;color:var(--sub)}
.stat.warn b{color:var(--warn)}
.menu{display:grid;gap:12px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-bottom-width:4px;border-radius:var(--r);padding:16px;font:inherit;color:inherit;cursor:pointer}
.mbtn:hover{border-color:var(--main)}
.mbtn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.mbtn .ic{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:#fff;background:var(--main)}
.mbtn .ic.y{background:var(--warn)} .mbtn .ic.g{background:#5b6f8f}
.mbtn b{display:block;font-size:1.05rem;font-weight:800}
.mbtn small{color:var(--sub);font-size:.85rem}
.badge{display:inline-block;margin-left:6px;background:var(--warn);color:#fff;border-radius:999px;font-size:.75rem;padding:0 8px;vertical-align:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 20px;border-radius:14px;
  border:0;border-bottom:4px solid var(--main-d);background:var(--main);color:#fff;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.btn.danger{background:var(--ng);border-bottom-color:#8f241d}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.label{font-weight:800;font-size:.9rem;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--main);background:var(--main-l);color:var(--main-d);font-weight:800}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:.85rem;color:var(--sub)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .3s}
.tag{display:inline-block;background:var(--main-l);color:var(--main-d);border-radius:8px;padding:1px 8px;font-size:.78rem;font-weight:700}
.tag.y{background:var(--warn-bg);color:var(--warn)}
.qtext{font-size:1.12rem;font-weight:700;margin:8px 0 16px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;
  border-radius:14px;padding:13px 14px;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer;line-height:1.6}
.choice:hover:not(:disabled){border-color:var(--main)}
.choice:disabled{cursor:default}
.choice .k{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--sub)}
.choice .body{flex:1}
.choice .marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mk{font-size:.76rem;font-weight:800;border-radius:6px;padding:1px 8px}
.mk.ok{background:var(--ok);color:#fff} .mk.ng{background:var(--ng);color:#fff} .mk.me{background:var(--ink);color:#fff}
.choice.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.is-ok .k{border-color:var(--ok);background:var(--ok);color:#fff}
.choice.is-ng{border-color:var(--ng);background:var(--ng-bg)}
.choice.is-ng .k{border-color:var(--ng);background:var(--ng);color:#fff}
.choice.dim{opacity:.75}
.verdict{border-radius:14px;padding:14px 16px;margin:16px 0 12px;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.verdict.ok{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng);border:2px solid var(--ng)}
.verdict small{display:block;font-size:.88rem;font-weight:700;color:var(--ink)}
.exp h3{font-size:.98rem;margin:16px 0 6px;font-weight:800;display:flex;align-items:center;gap:8px}
.exp h3 .n{width:24px;height:24px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-size:.8rem}
.exp .box{background:var(--bg);border-radius:12px;padding:12px 14px}
.exp ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exp li{background:var(--bg);border-radius:12px;padding:10px 14px}
.exp li b{display:block;font-size:.9rem}
.exp .point{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:10px;padding:12px 14px}
.calc{background:#fff;border:1px dashed #b9c6bd;border-radius:10px;padding:10px 14px;margin:10px 0 0;font-size:.95rem;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.calc::before{content:"途中式";display:block;font-size:.78rem;font-weight:800;color:var(--main-d)}
.next{margin-top:18px}
.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:2.6rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.8rem;color:var(--sub);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.9rem}
.list li .tag{margin-right:6px}
.result-score{font-size:3rem;font-weight:800;color:var(--main-d);line-height:1.1}
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}
.prog{display:flex;justify-content:space-between;font-size:.85rem;color:var(--sub);margin-bottom:6px}
@media (max-width:480px){
  .wrap{padding:12px 12px 40px}
  .card{padding:16px}
  .qtext{font-size:1.05rem}
  .stat b{font-size:1.3rem}
}
:focus-visible{outline:3px solid #4a90e2;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="homeLink" type="button"><span class="dot">生</span>情報生命科学 4択ドリル</button>
    <span class="save" id="saveState">読み込み中…</span>
  </header>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>

<script>
// ===== 問題データ =====
// 1問 = { id, round(第何回), topic, q(問題文), choices[4]: {t:選択肢, ok:正解ならtrue, why:その選択肢の解説}, point(覚えるポイント), calc?(途中式の配列) }
// 追加するときは、この配列に同じ形のオブジェクトを足すだけでOK（idは重複させない）。
const QUESTIONS = [
// ---------- 第1回 生命とは／神経系の構造 ----------
{ id:"r1-01", round:1, topic:"細胞説",
  q:"細胞説の内容として正しいものはどれか。",
  choices:[
    {t:"すべての生物は細胞でできており、細胞は生命の構造・機能の基本単位である", ok:true,
     why:"細胞説の中心となる2つの主張です。動物・植物・微生物を問わず当てはまります。"},
    {t:"すべての生物は核をもつ細胞でできており、核が生命の基本単位である",
     why:"細胞説の基本単位は「細胞」で、核ではありません。赤血球のように核をもたない細胞もあります。"},
    {t:"動物は細胞でできているが、植物や微生物は細胞以外の構造でもよい",
     why:"細胞説は動物・植物・微生物を区別せず、「すべての生物」が細胞でできているとします。"},
    {t:"ウイルスも含め、遺伝情報をもつものはすべて細胞でできているとする",
     why:"ウイルスは細胞でできていません。だからこそ生物ではないと考えられています。"}],
  point:"細胞説＝「すべての生物は細胞でできている」＋「細胞は生命の構造・機能の基本単位」。基本単位は細胞であって核ではない。"},
{ id:"r1-02", round:1, topic:"ウイルス",
  q:"ウイルスが生物とは認識されていない理由として、授業の説明に合うものはどれか。",
  choices:[
    {t:"核はあるが、細胞膜と細胞質をもたないから",
     why:"ウイルスは核ももちません。細胞膜・細胞質・核という細胞の構造をもたない＝細胞でできていない、というのが理由です。"},
    {t:"核をもたず、遺伝情報を細胞質に置いているから",
     why:"核がないことは理由になりません。核のない赤血球も細胞です。また、ウイルスには細胞質がありません。"},
    {t:"細胞でできておらず、細胞説の条件を満たさないから", ok:true,
     why:"細胞説では「すべての生物は細胞でできている」ので、細胞構造をもたないウイルスは生物とはされません。"},
    {t:"細胞でできているが、細胞が1つしかないから",
     why:"細胞1つでできた単細胞生物も生物です。そもそもウイルスは細胞でできていません。"}],
  point:"生物かどうかの判断基準は「細胞でできているか」。核の有無ではない（赤血球と混同しないこと）。"},
{ id:"r1-03", round:1, topic:"細胞の構造",
  q:"動物細胞の構造とその説明の組み合わせとして正しいものはどれか。",
  choices:[
    {t:"細胞質：細胞の中央にある玉状の構造で、DNAを保存する",
     why:"これは核の説明です。細胞質は、細胞膜で覆われた内側を満たす液体です。"},
    {t:"核：細胞の中央にある玉状の構造で、DNAを保存する", ok:true,
     why:"核は細胞の中央にある玉状の構造で、遺伝情報を保存するDNA分子があります。"},
    {t:"核：細胞膜で覆われた内側を満たし、DNAが溶けている液体",
     why:"細胞膜の内側を満たす液体は細胞質です。核とは別の構造です。"},
    {t:"細胞膜：細胞の中央にあり、遺伝情報を保存している",
     why:"細胞膜は細胞の外側を覆う膜です。遺伝情報（DNA）は核にあります。"}],
  point:"細胞膜＝外側の膜、細胞質＝膜の内側の液体、核＝中央の玉状構造（DNA）。③の×問題は「核」を「細胞質」にすり替えていた。"},
{ id:"r1-04", round:1, topic:"赤血球",
  q:"赤血球についての説明として正しいものはどれか。",
  choices:[
    {t:"核をもたないため、細胞ではなく細胞の断片として扱われる",
     why:"赤血球は核をもたない「細胞」です。「細胞は核をもつ」という原則の例外として紹介されました。"},
    {t:"核をもたないかわりに、細胞膜の中にDNAを保存している",
     why:"赤血球は核がなく、DNAを細胞膜に保存しているわけでもありません。"},
    {t:"細胞膜をもたないので、酸素が自由に出入りできる",
     why:"細胞膜と細胞質は細胞に必ずあります。赤血球にないのは核です。"},
    {t:"核をもたず、そのぶん酸素を運ぶヘモグロビンを多く詰め込める", ok:true,
     why:"赤血球は酸素輸送に特化した細胞で、核がないぶんヘモグロビンを多く詰め込めます。"}],
  point:"細胞膜と細胞質は必ずある。核は「ふつうはある」が赤血球は例外。「細胞は必ず核を持つ」は×。"},
{ id:"r1-05", round:1, topic:"中枢神経系",
  q:"授業での脳の分け方（4つの部分）として正しいものはどれか。",
  choices:[
    {t:"大脳・中脳・小脳・脳幹",
     why:"中脳は脳幹を構成する部分の一つで、4つの部分には入りません。"},
    {t:"大脳・間脳・小脳・脊髄",
     why:"脊髄は脳ではありません。中枢神経系は「脳」と「脊髄」に分けられます。"},
    {t:"大脳・間脳・小脳・脳幹", ok:true,
     why:"授業では、脳を大脳・間脳・小脳・脳幹の4つに分けました。"},
    {t:"大脳・小脳・脳幹・延髄",
     why:"延髄は脳幹の一部です。脳幹と並べて数えることはしません。"}],
  point:"脳＝大脳・間脳・小脳・脳幹。中脳と延髄は脳幹の中の部分。「中脳」と「間脳」の入れ替えに注意。"},
{ id:"r1-06", round:1, topic:"中枢神経系",
  q:"ヒトの神経系の分類として正しいものはどれか。",
  choices:[
    {t:"中枢神経系は脳と脊髄で、それ以外の神経が末梢神経系である", ok:true,
     why:"脳と脊髄が中枢神経系です。皮膚や筋肉などにつながる、それ以外の神経が末梢神経系です。"},
    {t:"中枢神経系は脳だけで、脊髄から先が末梢神経系である",
     why:"脊髄も中枢神経系です。第2回①の×問題「脊髄は末梢神経系」と同じすり替えです。"},
    {t:"中枢神経系は脳と脊髄と自律神経系で、残りが末梢神経系である",
     why:"自律神経系は末梢神経系の一部です。中枢神経系には入りません。"},
    {t:"中枢神経系は大脳と小脳で、脳幹と脊髄は末梢神経系である",
     why:"脳幹は脳の一部、脊髄も中枢神経系です。どちらも末梢神経系ではありません。"}],
  point:"中枢＝脳（大脳・間脳・小脳・脳幹）＋脊髄。末梢＝それ以外（体性神経系・自律神経系）。"},
{ id:"r1-07", round:1, topic:"末梢神経系",
  q:"末梢神経系についての説明として正しいものはどれか。",
  choices:[
    {t:"自律神経系は体の知覚・運動を制御し、感覚神経と運動神経からなる",
     why:"体の知覚・運動を制御し、感覚神経と運動神経を含むのは体性神経系です。"},
    {t:"体性神経系は体の知覚・運動を制御し、感覚神経と運動神経を含む", ok:true,
     why:"体性神経系は知覚・運動を担当し、感覚神経（センサー→脳）と運動神経（脳→筋肉）を含みます。"},
    {t:"感覚神経は、脳からの刺激を筋肉などに伝える体性神経系の神経である",
     why:"脳から筋肉へ伝えるのは運動神経です。感覚神経は皮膚などのセンサーから脳へ伝えます。"},
    {t:"運動神経は、皮膚などのセンサーからの刺激を脳に伝える神経である",
     why:"センサーから脳へ伝えるのは感覚神経です。運動神経は逆向き（脳→筋肉）です。"}],
  point:"体性神経系＝知覚・運動（感覚神経：センサー→脳、運動神経：脳→筋肉）。自律神経系＝内臓・血管の制御。"},
{ id:"r1-08", round:1, topic:"末梢神経系",
  q:"末梢神経系のうち、内臓や血管などの働きを制御するものはどれか。",
  choices:[
    {t:"体性神経系",
     why:"体性神経系は体の知覚・運動を制御します。内臓・血管の制御ではありません。"},
    {t:"運動神経",
     why:"運動神経は脳から筋肉などに刺激を伝える、体性神経系の神経です。"},
    {t:"感覚神経",
     why:"感覚神経は皮膚などのセンサーからの刺激を脳に伝える、体性神経系の神経です。"},
    {t:"自律神経系", ok:true,
     why:"自律神経系は、意識とは関係なく内臓・血管などの働きを制御します。"}],
  point:"「自律」＝自分の意思と関係なく働く→内臓・血管。「体性」＝体を感じて動かす→知覚・運動。"},
{ id:"r1-09", round:1, topic:"脳幹",
  q:"脳幹の位置についての説明として正しいものはどれか。",
  choices:[
    {t:"頭蓋骨の外側にあり、頭蓋骨を出たあとの脊髄の上端部分にあたる",
     why:"脳幹は頭蓋骨の内側にあります。第2回②の×問題「頭蓋骨の外にある」と同じすり替えです。"},
    {t:"脳の最も外側にあり、大脳を包むように位置する",
     why:"脳幹は脳の下部の奥にあります。大脳を包んでいるわけではありません。"},
    {t:"脳の下部で頭蓋骨の内側にあり、頭蓋骨を出ると脊髄につながる", ok:true,
     why:"脳幹は脳の下部、頭蓋骨の内側にあり、頭蓋骨の外に出ると脊髄になります。"},
    {t:"頭蓋骨の内側にあるが、脳ではなく末梢神経系に分類される",
     why:"脳幹は脳の一部で、中枢神経系です。末梢神経系ではありません。"}],
  point:"脳幹：脳の下部・頭蓋骨の「内側」→ 頭蓋骨を出ると脊髄。どちらも中枢神経系。"},

// ---------- 第2回 神経系の構造・機能／神経細胞 ----------
{ id:"r2-01", round:2, topic:"脳の機能",
  q:"次の機能のうち、主に大脳が担当しているものはどれか。",
  choices:[
    {t:"呼吸や血圧の調節",
     why:"呼吸・血圧など生命維持に直接関わる調節は脳幹が担当します。"},
    {t:"視覚情報の処理", ok:true,
     why:"大脳は視覚・聴覚・触覚などの感覚情報の処理や、記憶・情動などの高度な情報処理を担当します。"},
    {t:"体温の調節",

    {t:"K⁺は細胞外の方が濃いので、細胞外向きに働く",
     why:"K⁺は細胞内に多いです。また、濃い側に向かって力が働くこともありません。"}],
  point:"K⁺は細胞内に多い→濃度勾配の力は「外向き」。"},
{ id:"r5-08", round:5, topic:"静止電位",
  q:"静止状態で、K⁺に働く電場の力の向きとその理由として正しいものはどれか。",
  choices:[
    {t:"細胞内は細胞外より電位が低いので、K⁺を細胞内へ引き寄せる", ok:true,
     why:"細胞内は負電荷が多く低電位です。正電荷のK⁺は低電位側へ力を受けるので、細胞内向きです。"},
    {t:"細胞内は細胞外より電位が高いので、K⁺を細胞外へ押し出す",
     why:"静止状態では細胞内の方が電位が低いです。"},
    {t:"細胞内は細胞外より電位が低いので、K⁺を細胞外へ押し出す",
     why:"正電荷は低電位側へ引かれます。細胞内が低電位なら、K⁺は内へ引かれます。"},
    {t:"K⁺はリークチャネルを通るので、電場の力は働かない",
     why:"K⁺は正電荷をもつので、電場の力を受けます。濃度勾配の力とつり合っているのです。"}],
  point:"静止状態：細胞内＝低電位→K⁺（＋）は電場の力で「内向き」。濃度勾配（外向き）と逆向き。"},
{ id:"r5-09", round:5, topic:"静止電位",
  q:"静止状態で膜電位が安定している理由として正しいものはどれか。",
  choices:[
    {t:"K⁺に働く電場の力と濃度勾配の力が、同じ向き・同じ大きさで働くから",
     why:"2つの力は向きが反対です。同じ向きなら打ち消し合わず、K⁺は動き続けます。第5回⑨の×問題です。"},
    {t:"Na⁺に働く電場の力と濃度勾配の力が、反対向き・同じ大きさでつり合うから",
     why:"静止電位でつり合っているのはNa⁺ではなくK⁺です（K⁺リークチャネル）。"},
    {t:"K⁺に働く濃度勾配の力（内向き）と電場の力（外向き）が等しくつり合うから",
     why:"向きが逆です。濃度勾配の力は外向き、電場の力は内向きです。"},
    {t:"K⁺に働く濃度勾配の力（外向き）と電場の力（内向き）が等しくつり合うから", ok:true,
     why:"K⁺に対する2つの力が反対向きで大きさが等しいので、正味の移動がなくなり、電位が安定します。"}],
  point:"静止電位＝K⁺の「濃度勾配の力（外向き）」と「電場の力（内向き）」がつり合った状態。"},
{ id:"r5-10", round:5, topic:"静止電位",
  q:"膜電位がプラスのとき、K⁺に働く電場の力の向きとして正しいものはどれか。",
  choices:[
    {t:"細胞外から細胞内へ向かう",
     why:"膜電位がプラス＝細胞内が高電位です。正電荷のK⁺は高電位側から押し出されます。"},
    {t:"細胞内から細胞外へ向かう", ok:true,
     why:"膜電位がプラスなら細胞内が高電位なので、正電荷のK⁺は細胞内→細胞外へ力を受けます。"},
    {t:"K⁺は正電荷なので、膜電位の符号に関係なく常に細胞内へ向かう",
     why:"電場の力の向きは、どちらが高電位かで決まります。膜電位の符号が変われば向きも変わります。"},
    {t:"膜電位がプラスだとK⁺リークチャネルが閉じるので、力は働かない",
     why:"K⁺リークチャネルにはゲートがなく、常に開いています。"}],
  point:"電場の力の向きは「どちらが高電位か」で決まる。膜電位プラス＝内が高電位→K⁺は外へ。"},
{ id:"r5-11", round:5, topic:"静止電位の変化",
  q:"静止状態から細胞内のK⁺が増えたとき、どうなるか。",
  choices:[
    {t:"濃度勾配の力が強くなりK⁺が外へ出て、膜電位は下がる", ok:true,
     why:"K⁺の濃度差が大きくなり外向きの力が強まります。正電荷のK⁺が外へ出るので、細胞内の電位は下がります（例：−70mV→−90mV）。"},
    {t:"濃度勾配の力が強くなりK⁺が外へ出て、膜電位は上がる",
     why:"正電荷が外へ出ると細胞内はよりマイナスになるので、膜電位は下がります。"},
    {t:"細胞内の正電荷が増えるので、K⁺は動かず膜電位は上がったままになる",
     why:"K⁺リークチャネルは常に開いているので、強くなった濃度勾配の力によりK⁺は外へ移動します。"},
    {t:"濃度勾配の力が弱くなりK⁺が内へ入って、膜電位は上がる",
     why:"細胞内のK⁺が増えると濃度差は大きくなるので、濃度勾配の力は強くなります。"}],
  point:"細胞内K⁺↑ → 濃度勾配の力↑ → K⁺が外へ → 膜電位↓ → 電場の力も強まり、新しいつり合いに（例：−90mV）。"},
{ id:"r5-12", round:5, topic:"静止電位の変化",
  q:"静止状態から細胞内の正電荷が減り、細胞内外の電位差が大きくなったとき、K⁺リークチャネルで起こることとして正しいものはどれか。",
  choices:[
    {t:"濃度勾配の力が強まってK⁺が外へ出て、電位差がさらに大きくなる",
     why:"変わったのは電位差（電場の力）です。電場の力が強まり、K⁺は内へ入ります。"},
    {t:"電場の力が弱まってK⁺が外へ出て、電位差がさらに大きくなる",
     why:"電位差が大きくなると、電場の力は強くなります。"},
    {t:"電場の力が強まってK⁺が内へ入り、電位差が小さくなる", ok:true,
     why:"電位差が大きいほどK⁺を内へ引く電場の力が強まります。正電荷のK⁺が中へ入ると細胞内の電位が上がり、電位差が小さくなって新たな平衡になります。"},
    {t:"K⁺リークチャネルは閉じ、Na⁺/K⁺ポンプだけが電位差を元に戻す",
     why:"K⁺リークチャネルは常に開いています。K⁺の移動で電位差が戻る方向に変化します。"}],
  point:"電位差↑ → 電場の力↑ → K⁺が内へ → 細胞内の電位↑ → 電位差↓ → 新しいつり合い。変化を打ち消す方向に戻る。"},
];
if (typeof module !== "undefined") module.exports = QUESTIONS;

</script>
<script>
"use strict";
// ================= 保存まわり =================
// 学習記録は「この端末(localStorage)」に即保存し、使えるときはクラウド(db)にも保存する。
// 2つのうち updatedAt が新しい方を採用する。
const LS_KEY = "ilsDrill.v1";
const MAX_LOG = 300;
function emptyState(){ return { v:1, updatedAt:0, items:{}, log:[] }; }
function normalize(s){
  if(!s || typeof s!=="object") return emptyState();
  const out = emptyState();
  out.updatedAt = Number(s.updatedAt)||0;
  if(s.items && typeof s.items==="object") for(const [k,it] of Object.entries(s.items)){
    if(!it||typeof it!=="object") continue;
    out.items[k] = { correct:+it.correct||0, wrong:+it.wrong||0,
      status: (it.status==="review"||it.status==="cleared")?it.status:null,
      lastAt:+it.lastAt||0, lastWrongAt:+it.lastWrongAt||0 };
  }
  if(Array.isArray(s.log)) out.log = s.log.filter(x=>x&&x.id).slice(-MAX_LOG);
  return out;
}
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); return raw?normalize(JSON.parse(raw)):null; }catch(e){ return null; } }
function saveLocal(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); return true; }catch(e){ return false; } }

let state = loadLocal() || emptyState();
let cloud = { ref:null, ok:false, writing:false, dirty:false };
let localOk = saveLocal(state);

function setSaveLabel(){
  const el = document.getElementById("saveState");
  if(!el) return;
  el.textContent = cloud.ok ? "☁ クラウドに保存" : (localOk ? "この端末に保存" : "⚠ 保存できません（記録は閉じると消えます）");
}
async function pushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){ cloud.dirty = true; return; }   // 書き込みは1つずつ
  cloud.writing = true;
  try{
    do{ cloud.dirty=false; await cloud.ref.set(JSON.parse(JSON.stringify(state))); }while(cloud.dirty);
    cloud.ok = true;
  }catch(e){ cloud.ok = false; }
  cloud.writing = false; setSaveLabel();
}
function persist(){
  state.updatedAt = Date.now();
  localOk = saveLocal(state);
  setSaveLabel();
  pushCloud();
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc("data/users/"+uid+"/progress");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    cloud.ref = ref; cloud.ok = true;
    const remote = snap.exists ? normalize(snap.data()) : null;
    if(remote && remote.updatedAt > state.updatedAt){
      state = remote; localOk = saveLocal(state);
      if(!session) render();      // 解答中は画面を差し替えない
    }else if(!remote || remote.updatedAt < state.updatedAt){
      pushCloud();
    }
  }catch(e){ cloud.ok=false; }
  setSaveLabel();
}

// ================= 問題データの確認 =================
const QMAP = {};
const ROUNDS = [...new Set(QUESTIONS.map(q=>q.round))].sort((a,b)=>a-b);
const ROUND_NAME = {1:"生命とは・神経系の構造",2:"神経系の機能・神経細胞",3:"細胞膜と物質輸送",4:"イオンチャネルとポンプ",5:"膜電位・静止電位"};
for(const q of QUESTIONS){
  const nOk = q.choices.filter(c=>c.ok).length;
  if(QMAP[q.id]) console.error("ID重複:", q.id);
  if(q.choices.length!==4 || nOk!==1) console.error("選択肢が4つ/正解1つではない:", q.id);
  QMAP[q.id] = q;
}

// ================= 記録のロジック =================
function item(id){ return state.items[id] || (state.items[id]={correct:0,wrong:0,status:null,lastAt:0,lastWrongAt:0}); }
// 回答を記録する。mode: "normal" | "review"
function recordAnswer(id, ok, mode){
  const it = item(id), now = Date.now();
  it.lastAt = now;
  if(ok){
    it.correct++;
    if(mode==="review" && it.status==="review") it.status = "cleared"; // 復習で正解 → 克服済み
  }else{
    it.wrong++; it.lastWrongAt = now;
    it.status = "review";            // どのモードでも間違えたら要復習（克服済みからも戻る）
  }
  state.log.push({id, ok, mode, at:now});
  if(state.log.length>MAX_LOG) state.log = state.log.slice(-MAX_LOG);
  persist();
}
function idsByStatus(st){ return Object.keys(state.items).filter(id=>QMAP[id] && state.items[id].status===st); }
// 要復習：間違えた回数が多い順 → 最近間違えた順（未解決を優先）
function reviewQueue(includeCleared){
  const byPriority = (a,b)=> (state.items[b].wrong-state.items[a].wrong) || (state.items[b].lastWrongAt-state.items[a].lastWrongAt);
  const r = idsByStatus("review").sort(byPriority);
  if(!includeCleared) return r;
  return r.concat(idsByStatus("cleared").sort(byPriority));
}
function totals(){
  let c=0,w=0; for(const id in state.items){ if(!QMAP[id]) continue; c+=state.items[id].correct; w+=state.items[id].wrong; }
  return { answered:c+w, correct:c, rate: (c+w)? Math.round(c/(c+w)*100) : null,
           review: idsByStatus("review").length, cleared: idsByStatus("cleared").length };
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ================= 画面 =================
const app = document.getElementById("app");
let session = null;   // {mode, ids, idx, order, answered, picked, results:[]}
const setup = { rounds: new Set(ROUNDS), count: 10 };
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEYS = ["A","B","C","D"];

function render(view){
  view = view || (session ? "quiz" : (location.hash.replace("#","")||"home"));
  if(view==="quiz" && !session) view = "home";
  ({home:viewHome, setup:viewSetup, review:viewReviewHome, records:viewRecords, quiz:viewQuiz, result:viewResult}[view] || viewHome)();
  window.scrollTo(0,0);
}
function go(view){ if(view!=="quiz"&&view!=="result") session=null; try{ history.replaceState(null,"",view==="home"?location.pathname:"#"+view);}catch(e){} render(view); }

function statsHTML(){
  const t = totals();
  return `<div class="stats">
    <div class="stat"><b>${t.answered}</b><span>回答数</span></div>
    <div class="stat"><b>${t.rate===null?"—":t.rate+"%"}</b><span>正答率</span></div>
    <div class="stat warn"><b>${t.review}</b><span>要復習</span></div>
  </div>`;
}
function viewHome(){
  const t = totals();
  app.innerHTML = `
  <section class="card">
    <h1>今日も1セットやろう</h1>
    <p class="muted">第1〜5回のふりかえりテストの範囲から、全${QUESTIONS.length}問の4択問題。</p>
    ${statsHTML()}
  </section>
  <nav class="menu">
    <button class="mbtn" data-go="setup"><span class="ic">▶</span><span><b>通常学習</b><small>範囲と問題数を選んで解く</small></span></button>
    <button class="mbtn" data-go="review"><span class="ic y">↺</span><span><b>間違えた問題の復習${t.review?`<span class="badge">${t.review}</span>`:""}</b><small>要復習 ${t.review}問 ／ 克服済み ${t.cleared}問</small></span></button>
    <button class="mbtn" data-go="records"><span class="ic g">≡</span><span><b>学習記録</b><small>回ごとの正答率・要復習の一覧</small></span></button>
  </nav>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function viewSetup(){
  const pool = QUESTIONS.filter(q=>setup.rounds.has(q.round));
  app.innerHTML = `
  <section class="card">
    <h2>通常学習</h2>
    <div class="label">出題範囲</div>
    <div class="chips" id="rchips">
      <button class="chip" data-all aria-pressed="${setup.rounds.size===ROUNDS.length}">すべて</button>
      ${ROUNDS.map(r=>`<button class="chip" data-r="${r}" aria-pressed="${setup.rounds.has(r)&&setup.rounds.size!==ROUNDS.length}">第${r}回</button>`).join("")}
    </div>
    <p class="muted" style="margin-top:8px">${[...setup.rounds].sort().map(r=>`第${r}回 ${ROUND_NAME[r]||""}`).join("／")}</p>
    <div class="label">問題数</div>
    <div class="chips" id="cchips">
      ${[5,10,20,0].map(n=>`<button class="chip" data-c="${n}" aria-pressed="${setup.count===n}">${n?n+"問":"全部"}</button>`).join("")}
    </div>
    <p class="muted" style="margin-top:12px">対象 ${pool.length}問 → ${Math.min(setup.count||pool.length,pool.length)}問をランダムに出題します。選択肢の並びも毎回シャッフルします。</p>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" id="back">戻る</button>
      <button class="btn" id="start" ${pool.length?"":"disabled"}>スタート</button>
    </div>
  </section>`;
  app.querySelector("[data-all]").onclick=()=>{ setup.rounds=new Set(ROUNDS); viewSetup(); };
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;
    if(setup.rounds.size===ROUNDS.length) setup.rounds=new Set([r]);
    else if(setup.rounds.has(r)){ setup.rounds.delete(r); if(!setup.rounds.size) setup.rounds=new Set(ROUNDS); }
    else setup.rounds.add(r);
    viewSetup();
  });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ setup.count=+b.dataset.c; viewSetup(); });
  app.querySelector("#back").onclick=()=>go("home");
  app.querySelector("#start").onclick=()=>{
    const ids = shuffle(pool.map(q=>q.id)).slice(0, setup.count||pool.length);
    startSession("normal", ids);
  };
}

function viewReviewHome(){
  const t = totals();
  const allQ = QUESTIONS.length;
  const touched = t.review + t.cleared;
  const pct = touched ? Math.round(t.cleared/touched*100) : 0;
  if(!t.review){
    app.innerHTML = `
    <section class="card empty">
      <div class="big">${t.cleared?"🎉":"📭"}</div>
      <h2>${t.cleared?"要復習の問題はありません":"まだ復習する問題がありません"}</h2>
      <p class="muted">${t.cleared
        ? `間違えた問題はすべて克服済みです（克服済み ${t.cleared}問）。克服済みの問題をもう一度解いて確認することもできます。`
        : "通常学習で間違えた問題が、ここに自動で登録されます。まずは通常学習から始めましょう。"}</p>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="back">ホームへ</button>
        ${t.cleared?`<button class="btn" id="again">克服済みを解き直す（${t.cleared}問）</button>`:`<button class="btn" id="toSetup">通常学習へ</button>`}
      </div>
    </section>`;
    app.querySelector("#back").onclick=()=>go("home");
    const a=app.querySelector("#again"); if(a) a.onclick=()=>startSession("review", shuffle(idsByStatus("cleared")));
    const s=app.querySelector("#toSetup"); if(s) s.onclick=()=>go("setup");
    return;
  }
  const q = reviewQueue(false);
  app.innerHTML = `
  <section class="card">
    <h2>間違えた問題の復習</h2>
    <div class="prog"><span>克服の進み具合</span><span>${t.cleared} / ${touched}問 克服済み</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat warn"><b>${t.review}</b><span>要復習</span></div>
      <div class="stat"><b>${t.cleared}</b><span>克服済み</span></div>
      <div class="stat"><b>${allQ - touched}</b><span>未ミス／未回答</span></div>
    </div>
    <p class="muted" style="margin-top:12px">要復習の問題を、間違えた回数が多い順に出題します。正解すると「克服済み」へ移り、また間違えると「要復習」に戻ります。選択肢の順番は毎回シャッフルします。</p>
    <div class="row">
      <button class="btn ghost" id="back">戻る</button>
      <button class="btn" id="start">要復習 ${t.review}問を解く</button>
    </div>
    ${t.cleared?`<button class="btn ghost wide" id="startAll" style="margin-top:10px">克服済みも含めて解く（${t.review+t.cleared}問）</button>`:""}
  </section>
  <section class="card">
    <h2>要復習の問題</h2>
    <ul class="list">${q.map(id=>{const Q=QMAP[id],it=state.items[id];return `<li><span class="tag">第${Q.round}回</span><span class="tag y">×${it.wrong}</span>${esc(Q.q)}</li>`;}).join("")}</ul>
  </section>`;
  app.querySelector("#back").onclick=()=>go("home");
  app.querySelector("#start").onclick=()=>startSession("review", reviewQueue(false));
  const sa=app.querySelector("#startAll"); if(sa) sa.onclick=()=>startSession("review", reviewQueue(true));
}

function viewRecords(){
  const t = totals();
  const per = ROUNDS.map(r=>{
    let c=0,w=0,rev=0,clr=0,n=0;
    for(const q of QUESTIONS) if(q.round===r){ n++; const it=state.items[q.id]; if(!it) continue; c+=it.correct; w+=it.wrong; if(it.status==="review")rev++; if(it.status==="cleared")clr++; }
    return {r,n,c,w,rev,clr};
  });
  const recent = state.log.slice(-15).reverse().filter(l=>QMAP[l.id]);
  const fmt = ms => { const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  app.innerHTML = `
  <section class="card"><h2>学習記録</h2>${statsHTML()}
    <p class="muted" style="margin-top:10px">克服済み ${t.cleared}問 ／ 全${QUESTIONS.length}問</p></section>
  <section class="card"><h2>回ごとの成績</h2>
    <table><thead><tr><th>回</th><th>回答</th><th>正答率</th><th>要復習</th><th>克服</th></tr></thead><tbody>
    ${per.map(p=>`<tr><td>第${p.r}回 <span class="muted">(${p.n}問)</span></td><td class="num">${p.c+p.w}</td><td class="num">${p.c+p.w?Math.round(p.c/(p.c+p.w)*100)+"%":"—"}</td><td class="num">${p.rev}</td><td class="num">${p.clr}</td></tr>`).join("")}
    </tbody></table></section>
  <section class="card"><h2>最近の回答</h2>
    ${recent.length?`<ul class="list">${recent.map(l=>`<li><span class="tag ${l.ok?"":"y"}">${l.ok?"○ 正解":"× 不正解"}</span><span class="muted">${fmt(l.at)}・${l.mode==="review"?"復習":"通常"}</span><br>${esc(QMAP[l.id].q)}</li>`).join("")}</ul>`:`<p class="muted">まだ回答がありません。</p>`}
  </section>
  <div class="row"><button class="btn ghost" id="back">ホームへ</button><button class="btn danger" id="reset">記録をリセット</button></div>`;
  app.querySelector("#back").onclick=()=>go("home");
  app.querySelector("#reset").onclick=()=>confirmModal("学習記録をすべて消しますか？","回答数・正答率・要復習／克服済みの状態がすべて消え、元に戻せません。","消す",()=>{
    state = emptyState(); persist(); go("records");
  });
}
function confirmModal(title, body, okText, onOk){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card"><h2>${esc(title)}</h2><p class="muted">${esc(body)}</p>
    <div class="row"><button class="btn ghost" id="mNo">やめる</button><button class="btn danger" id="mYes">${esc(okText)}</button></div></div></div>`;
  root.querySelector("#mNo").onclick=()=>root.innerHTML="";
  root.querySelector("#mYes").onclick=()=>{ root.innerHTML=""; onOk(); };
}

// ---------- 出題 ----------
function startSession(mode, ids){
  if(!ids.length){ go(mode==="review"?"review":"setup"); return; }
  session = { mode, ids, idx:0, order:null, answered:false, picked:null, results:[] };
  prepareQuestion();
  render("quiz");
}
function prepareQuestion(){
  session.order = shuffle([0,1,2,3]);     // 表示順（元の選択肢の番号）
  session.answered = false; session.picked = null;
  const it = state.items[session.ids[session.idx]];
  session.startStatus = it ? it.status : null;   // 出題時点の状態をタグに表示
}
function viewQuiz(){
  const s = session, Q = QMAP[s.ids[s.idx]];
  const it = s.startStatus!==undefined ? {status:s.startStatus} : state.items[Q.id];
  const done = s.idx + (s.answered?1:0);
  const okCount = s.results.filter(r=>r.ok).length;
  app.innerHTML = `
  <section class="card">
    <div class="qhead"><span>${s.mode==="review"?"復習":"通常学習"}　${s.idx+1} / ${s.ids.length}問</span><span>正解 ${okCount}／${s.results.length}</span></div>
    <div class="bar"><i style="width:${done/s.ids.length*100}%"></i></div>
    <span class="tag">第${Q.round}回</span> <span class="tag">${esc(Q.topic)}</span>
    ${it&&it.status==="review"?` <span class="tag y">要復習</span>`:""}${it&&it.status==="cleared"?` <span class="tag">克服済み</span>`:""}
    <div class="qtext">${esc(Q.q)}</div>
    <div class="choices" id="choices">
      ${s.order.map((ci,pos)=>choiceHTML(Q,ci,pos)).join("")}
    </div>
    <div id="after">${s.answered?afterHTML(Q):""}</div>
  </section>
  <button class="btn ghost" id="quit" style="width:100%">中断してホームへ</button>`;
  if(!s.answered){
    app.querySelectorAll(".choice").forEach(b=>b.addEventListener("click", ()=>answer(+b.dataset.ci), {once:true}));
  }else bindAfter();
  app.querySelector("#quit").onclick=()=>{ if(s.results.length) render("result"); else go("home"); };
}
function choiceHTML(Q, ci, pos){
  const s=session, c=Q.choices[ci];
  let cls="", marks="";
  if(s.answered){
    const mine = s.picked===ci;
    if(c.ok){ cls="is-ok"; marks+=`<span class="mk ok">✓ 正解</span>`; }
    else if(mine){ cls="is-ng"; marks+=`<span class="mk ng">✗ 不正解</span>`; }
    else cls="dim";
    if(mine) marks+=`<span class="mk me">あなたの回答</span>`;
  }
  return `<button class="choice ${cls}" data-ci="${ci}" ${s.answered?"disabled":""}>
    <span class="k">${KEYS[pos]}</span><span class="body">${esc(c.t)}${marks?`<span class="marks">${marks}</span>`:""}</span></button>`;
}
function answer(ci){
  const s=session;
  if(!s || s.answered) return;          // 連打・二重記録の防止
  s.answered = true; s.picked = ci;
  app.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  const Q=QMAP[s.ids[s.idx]], ok=!!Q.choices[ci].ok;
  s.results.push({id:Q.id, ok});
  recordAnswer(Q.id, ok, s.mode);
  viewQuiz();
  const v=document.getElementById("verdict"); if(v) v.scrollIntoView({behavior:"smooth",block:"start"});
}
function afterHTML(Q){
  const s=session, okIdx=Q.choices.findIndex(c=>c.ok), ok=s.picked===okIdx;
  const posOf = ci => KEYS[s.order.indexOf(ci)];
  const it=state.items[Q.id];
  const statusNote = ok
    ? (s.mode==="review" && it.status==="cleared" ? "この問題は「克服済み」に移りました。" : "")
    : "この問題は「要復習」に登録されました。";
  const others = s.order.filter(ci=>ci!==okIdx);
  return `
  <div class="verdict ${ok?"ok":"ng"}" id="verdict">${ok?"○":"×"}<div>${ok?"正解！":"不正解"}
    <small>あなたの回答：${posOf(s.picked)}　／　正解：${posOf(okIdx)}${statusNote?"<br>"+statusNote:""}</small></div></div>
  <div class="exp">
    <h3><span class="n">1</span>正解が ${posOf(okIdx)} になる理由</h3>
    <div class="box">${esc(Q.choices[okIdx].why)}
      ${Q.calc?`<div class="calc">${Q.calc.map(esc).join("\n")}</div>`:""}</div>
    <h3><span class="n">2</span>ほかの選択肢が不正解になる理由</h3>
    <ul>${others.map(ci=>`<li><b>${posOf(ci)}${s.picked===ci?"（あなたの回答）":""}：${esc(Q.choices[ci].t)}</b>${esc(Q.choices[ci].why)}</li>`).join("")}</ul>
    <h3><span class="n">3</span>覚えておくポイント</h3>
    <div class="point">${esc(Q.point)}</div>
  </div>
  <div class="next"><button class="btn wide" id="nextBtn">${s.idx+1<s.ids.length?"次の問題へ →":"結果を見る"}</button></div>`;
}
function bindAfter(){
  const b=document.getElementById("nextBtn");
  if(!b) return;
  b.addEventListener("click", ()=>{
    b.disabled = true;                   // 連打で2問飛ばさないように
    const s=session; if(!s) return;
    if(s.idx+1<s.ids.length){ s.idx++; prepareQuestion(); render("quiz"); }
    else render("result");
  }, {once:true});
}
function viewResult(){
  const s=session; if(!s){ go("home"); return; }
  const n=s.results.length, ok=s.results.filter(r=>r.ok).length;
  const wrong=s.results.filter(r=>!r.ok).map(r=>r.id);
  const cleared = s.mode==="review" ? s.results.filter(r=>r.ok && state.items[r.id].status==="cleared").length : 0;
  const t=totals();
  app.innerHTML = `
  <section class="card" style="text-align:center">
    <p class="muted">${s.mode==="review"?"復習":"通常学習"}の結果</p>
    <div class="result-score">${ok} / ${n}</div>
    <p>正答率 ${n?Math.round(ok/n*100):0}%${s.mode==="review"?`　・　克服 ${cleared}問`:""}</p>
    <p class="muted">要復習は全部で ${t.review}問 あります。</p>
  </section>
  ${wrong.length?`<section class="card"><h2>今回まちがえた問題</h2><ul class="list">${wrong.map(id=>`<li><span class="tag">第${QMAP[id].round}回</span>${esc(QMAP[id].q)}</li>`).join("")}</ul></section>`:""}
  <div class="row">
    <button class="btn ghost" id="home">ホームへ</button>
    ${t.review?`<button class="btn" id="rev">要復習を解く（${t.review}問）</button>`:`<button class="btn" id="more">もう1セット</button>`}
  </div>`;
  session=null;
  app.querySelector("#home").onclick=()=>go("home");
  const r=app.querySelector("#rev"); if(r) r.onclick=()=>startSession("review", reviewQueue(false));
  const m=app.querySelector("#more"); if(m) m.onclick=()=>go("setup");
}

document.getElementById("homeLink").onclick=()=>go("home");
window.addEventListener("hashchange", ()=>{ if(!session) render(); });
setSaveLabel();
render();
initCloud();
</script>
</body>
</html>
